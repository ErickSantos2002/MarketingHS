      responses:
        '200':
          description: Conversão atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  affected:
                    type: integer
                  updated:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversion'
        '400':
          description: session_id ou converted_at ausente/ inválido
        '401':
          description: Token inválido ou sem permissão de escrita
        '404':
          description: Nenhuma conversão encontrada para o session_id


  /analytics-api:
    get:
      operationId: analyticsGet
      summary: KPIs e métricas
      description: |
        Retorna métricas agregadas. Use o parâmetro type para escolher o relatório:
        overview, leads, sources ou pages. Todos suportam filtro de período.
      tags:
        - Analytics
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [overview, leads, sources, pages, daily, funnel, events]
          description: |
            Tipo de relatório:
            - `overview`, `leads`, `sources`, `pages` (legados)
            - `daily`: KPIs de um dia (params: `date`, `tz`)
            - `funnel`: lead → qualified → mql → sql → won (params: `period` [today|week|month|custom], `date_from`, `date_to`, `tz`). **Cumulativo**: um mesmo lead pode aparecer em múltiplos stages (semântica padrão de funil). Para contagem exclusiva por estágio, use `type=events` com `event_type` específico.
            - `events`: contagem de `contact_events` (params: `event_type` CSV, `date_from`, `date_to`, `tz`, `group_by` [none|day|source])
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 15d, 30d, 90d, all, today, week, month, custom]
            default: 30d
          description: Período de análise (depende do `type`).
        - name: date
          in: query
          schema: { type: string, example: "2026-05-28" }
          description: "Apenas `type=daily`. YYYY-MM-DD no `tz` informado. Default: hoje."
        - name: date_from
          in: query
          schema: { type: string, example: "2026-05-01" }
          description: "YYYY-MM-DD. Usado por `funnel` (period=custom) e `events`."
        - name: date_to
          in: query
          schema: { type: string, example: "2026-05-28" }
          description: "YYYY-MM-DD. Usado por `funnel` (period=custom) e `events`."
        - name: tz
          in: query
          schema: { type: string, default: America/Sao_Paulo }
          description: Timezone IANA aplicado a todos os parâmetros de data.
        - name: event_type
          in: query
          schema: { type: string, example: "meeting_scheduled,deal_won" }
          description: "Obrigatório para `type=events`. Lista CSV de event_types."
        - name: group_by
          in: query
          schema:
            type: string
            enum: [none, day, source]
            default: none
          description: "Apenas `type=events`. Agrupamento opcional."
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Overview
                    properties:
                      total_leads:
                        type: integer
                      hotleads:
                        type: integer
                      warm_leads:
                        type: integer
                      leads_hoje:
                        type: integer
                      leads_semana:
                        type: integer
                      score_medio:
                        type: integer
                      taxa_hotlead:
                        type: string
                      leads_no_nexus:
                        type: integer
                      clientes_ativos:
                        type: integer
                  - type: object
                    title: Leads por dia
                    properties:
                      period:
                        type: string
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            total:
                              type: integer
                            hotleads:
                              type: integer
                  - type: object
                    title: Por origem
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            utm_source:
                              type: string
                            total:
                              type: integer
                            hotleads:
                              type: integer
                            taxa_hot:
                              type: string
                  - type: object
                    title: Daily KPIs
                    description: |
                      Resposta de `type=daily`. Métricas de um único dia no `tz` informado.
                      - `new_leads`: leads criados no dia.
                      - `mql_from_existing`: leads antigos (criados antes do dia) que viraram MQL hoje (reconversões).
                      - `mql_total`: total distinto de leads com conversão `mql_reuniao_agendada` no dia (novos + reconversões). **Use este campo para o número real de MQLs do dia.**
                      - `by_status["MQL - Reunião agendada"]`: apenas leads NOVOS que já entraram como MQL (não inclui reconversões).
                    properties:
                      new_leads:
                        type: integer
                        description: Leads criados no dia.
                      meetings_scheduled:
                        type: integer
                        description: Eventos `scheduling_widget_booked` ou `meeting_scheduled` no dia.
                      deals_won:
                        type: integer
                      deals_lost:
                        type: integer
                      mql_from_existing:
                        type: integer
                        description: Leads criados antes do dia que viraram MQL hoje (reconversões).
                      mql_total:
                        type: integer
                        description: Total distinto de leads com conversão `mql_reuniao_agendada` no dia (novos + reconversões).
                      by_status:
                        type: object
                        additionalProperties: { type: integer }
                        description: Distribuição de leads NOVOS por status final no dia.
                      by_source:
                        type: object
                        additionalProperties: { type: integer }
