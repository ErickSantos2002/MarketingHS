  /publico/automacoes:
    get:
      operationId: automationsList
      summary: Listar regras de automação
      description: >
        Retorna todas as regras de automação, por prioridade decrescente.
        ATENÇÃO: as regras são cadastro. A ação de todas elas é o handoff para
        o Nexus, que ainda não está ligado neste sistema — a regra fica salva e
        pronta, mas nada dispara.
      tags:
        - Automações
      responses:
        '200':
          description: Lista de regras
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        is_active:
                          type: boolean
                        priority:
                          type: integer
                        condition_type:
                          type: string
                        condition_operator:
                          type: string
                        condition_value:
                          type: string
                        conditions:
                          type: array
                          items:
                            type: object
                        condition_logic:
                          type: string
                          enum: [and, or]
                        action_type:
                          type: string
                        action_metadata:
                          type: object
                        condition:
                          type: string
                          description: A condição legível, montada pelo servidor.
                        action:
                          type: string
                          description: A ação legível, montada pelo servidor.
    post:
      operationId: automationsCreate
      summary: Criar regra de automação
      tags:
        - Automações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - condition_type
                - condition_operator
                - action_type
              properties:
                name:
                  type: string
                priority:
                  type: integer
                condition_type:
                  type: string
                  enum: [status, etiqueta, tag, score, created_at]
                condition_operator:
                  type: string
                  enum: [is, is_not, greater_than, less_than, contains, between, after, before, last_n_days]
                condition_value:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                condition_logic:
                  type: string
                  enum: [and, or]
                action_type:
                  type: string
                  enum: [create_in_nexus, move_stage_nexus, block_nexus]
                action_value:
                  type: string
                action_metadata:
                  type: object
                is_active:
                  type: boolean
      responses:
        '201':
          description: Regra criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rule:
                    type: object

  /publico/automacoes/{id}:
    patch:
      operationId: automationsUpdate
      summary: Atualizar regra de automação
      description: O caminho de ativar e desativar uma regra.
      tags:
        - Automações
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                name:
                  type: string
                priority:
                  type: integer
      responses:
        '200':
          description: Regra atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rule:
                    type: object

  /publico/conversao:
    post:
      operationId: registerConversion
      summary: Registrar conversão de lead
      description: |
        Registra uma nova conversão para um lead existente. Atualiza
        `last_conversion_date` e dispara aplicação de tag automaticamente.
        Aceita identificação por `lead_id`, `dnia_id`, `email` ou `phone`.
      tags:
        - Conversões
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tipo
                - page_slug
              properties:
                lead_id:
                  type: string
                  format: uuid
                  description: ID do lead (alternativa a dnia_id/email/phone)
                dnia_id:
                  type: string
                  format: uuid
                  description: DN.IA ID do ecossistema (alternativa a lead_id/email/phone)
                email:
                  type: string
                  format: email
                  description: Email para resolver o lead
                phone:
                  type: string
                  description: Telefone/whatsApp para resolver o lead
                tipo:
                  type: string
                  example: modal_pago
                page_slug:
                  type: string
                  example: pago
                  description: Vira tag no lead se apply_tag=true
                session_id:
                  type: string
                  nullable: true
                converted_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Default = now()
                utm_source:
                  type: string
                  nullable: true
                utm_medium:
                  type: string
                  nullable: true
                utm_campaign:
                  type: string
                  nullable: true
                utm_term:
                  type: string
                  nullable: true
                utm_content:
                  type: string
                  nullable: true
                source:
                  type: string
                  nullable: true
                  description: "Origem da conversão (ex: programadeiaficacao)"
                apply_tag:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Conversão registrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lead_id:
                    type: string
                    format: uuid
                  conversion:
                    $ref: '#/components/schemas/Conversion'
        '400':
          description: Dados inválidos (tipo/page_slug ausente ou lead não encontrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido ou sem permissão de escrita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Lead não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateConversion
      summary: Atualizar converted_at de uma conversão
      description: |
        Atualiza o `converted_at` de uma conversão existente pelo `session_id`.
        Recalcula automaticamente o `last_conversion_date` do lead. Registra
        evento `conversion_updated` (com valores antigo e novo) na timeline
        para auditoria.

        Alias com a mesma semântica: `POST /publico/conversao/atualizar` —
        para clientes que preferem POST. O alias não pode viver em `POST
        /publico/conversao`, porque esse caminho já é a criação de conversão.
      tags:
        - Conversões
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - converted_at
              properties:
                session_id:
                  type: string
                  description: ID da sessão da conversão a atualizar
                converted_at:
                  type: string
                  format: date-time
                  description: Nova data/hora da conversão (ISO 8601)
      responses:
        '200':
          description: Conversão atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  affected:
                    type: integer
                  updated:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversion'
        '400':
          description: session_id ou converted_at ausente/ inválido
        '401':
          description: Token inválido ou sem permissão de escrita
        '404':
          description: Nenhuma conversão encontrada para o session_id
    delete:
      operationId: unregisterConversion
      summary: Remover conversão por session_id
      description: |
        Remove uma conversão existente pelo `session_id`. Recalcula
        automaticamente o `last_conversion_date` do lead com base nas
        conversões restantes. Registra evento `conversion_unregistered`
        na timeline do contato para auditoria.

        `session_id` é aceito no corpo OU na query string; quando os dois
        vierem, o corpo vence. O corpo é opcional — `DELETE
        /publico/conversao?session_id=xxx` sem corpo nenhum também funciona.

        Alias com a mesma semântica: `POST /publico/conversao/remover` —
        para clientes HTTP que lidam mal com corpo em DELETE. O alias não
        pode viver em `POST /publico/conversao`, porque esse caminho já é a
        criação de conversão.
      tags:
        - Conversões
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: ID da sessão da conversão a remover (alternativa ao corpo; o corpo vence quando os dois vierem)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: ID da sessão da conversão a remover
      responses:
        '200':
          description: Conversão removida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  affected:
                    type: integer
                  deleted:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversion'
        '400':
          description: session_id ausente (nem no corpo, nem na query)
        '401':
          description: Token inválido ou sem permissão de escrita
        '404':
          description: Nenhuma conversão encontrada para o session_id

  /publico/conversao/atualizar:
    post:
      operationId: updateConversionAlias
      summary: Atualizar converted_at de uma conversão (alias POST)
      description: |
        Alias de `PATCH /publico/conversao`, mesma semântica, mesmo corpo,
        mesma resposta. Existe porque a documentação original prometia
        "Aceita PATCH ou POST" e este caminho não podia ser `POST
        /publico/conversao` — esse já é a rota de criação de conversão.
      tags:
        - Conversões
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - converted_at
