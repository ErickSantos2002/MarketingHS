openapi: '3.0.3'
info:
  title: dnMarketing API
  version: '2.0.0'
  description: |
    O dnMarketing é o master de identidade do ecossistema DN.IA.
    Esta API permite que o Nexus, mentor.ia e agentes de IA se integrem para
    gerenciar contatos, segmentos, campanhas, páginas, automações e analytics.
  contact:
    name: DN.IA
    url: https://dnia.ai

servers:
  - url: https://{host}/api
    description: >-
      API do MarketingHS. ⚠️ O host de produção ainda não foi preenchido —
      ver docs/CONTINUAR-AQUI.md. Em desenvolvimento é http://127.0.0.1:8100.
    variables:
      host:
        default: PREENCHER-O-HOST-DE-PRODUCAO
        description: Host de produção do MarketingHS — ainda não decidido.

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        A API aceita dois tipos de autenticação via Bearer token:
        1. WEBHOOK_SECRET — chave master configurada nos Secrets do projeto.
        2. API Keys — chaves individuais no formato dnk_[32 chars], criadas em Settings → API Keys.
        
        Permissões das API Keys:
        - read: endpoints GET
        - write: endpoints POST/PATCH/DELETE
        - read_write: acesso completo (padrão)
        
        Header: Authorization: Bearer <token>

  schemas:
    EcosystemIdentity:
      type: object
      properties:
        dnia_id:
          type: string
          format: uuid
        phone:
          type: string
          example: '+5511999999999'
        email:
          type: string
          format: email
        nome:
          type: string
        stage:
          type: string
          enum: [lead, opportunity, client]
        first_touch_source:
          type: string
        first_touch_app:
          type: string
        dndash_lead_id:
          type: string
          format: uuid
          nullable: true
        nexus_contact_id:
          type: string
          format: uuid
          nullable: true
        mentoria_client_id:
          type: string
          format: uuid
          nullable: true
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LeadDetails:
      type: object
      properties:
        cargo:
          type: string
          nullable: true
        faturamento:
          type: string
          nullable: true
        funcionarios:
          type: string
          nullable: true
        etiqueta:
          type: string
          enum: [hotlead, warm, raw]
          nullable: true
        status:
          type: string
          nullable: true
        utm_source:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        page_slug:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ContactListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dnia_id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        cargo:
          type: string
        faturamento:
          type: string
        etiqueta:
          type: string
        status:
          type: string
        stage:
          type: string
        utm_source:
          type: string
        page_slug:
          type: string
        nexus_contact_id:
          type: string
          nullable: true
        mentoria_client_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string

    Campanha:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        channel:
          type: string
          enum: [email, whatsapp]
        status:
          type: string
          enum: [draft, scheduled, sending, sent, paused, failed]
        subject:
          type: string
          nullable: true
        segment_ids:
          type: array
          items:
            type: string
            format: uuid
        segment_names:
          type: object
          additionalProperties:
            type: string
          description: Mapa id -> nome, cobrindo inclusões e exclusões.
        stats:
          type: object
          description: |
            Ao vivo, agregado de campaign_sends. NÃO é a coluna `stats`, que é
            escrita uma vez só quando a fila drena e mostraria 0% de abertura
            para sempre.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true

    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        design:
          type: object
          nullable: true
        html:
          type: string
          nullable: true

    Segmento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [dynamic, static]
        rules:
          type: array
          items:
            type: object
        logic:
          type: string
          enum: [and, or]
        contacts_count:
          type: integer
          description: Só na listagem.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Conversion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        tipo:
          type: string
          example: modal_pago
        page_slug:
          type: string
          example: pago
        converted_at:
          type: string
          format: date-time
        session_id:
          type: string
          nullable: true
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        utm_term:
          type: string
          nullable: true
        utm_content:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          example: programadeiaficacao
          description: Origem da conversão
        created_at:
          type: string
          format: date-time

paths:
  /publico/identidade:
    get:
      operationId: identityLookup
      summary: Buscar identidade
      description: Busca uma identidade unificada por telefone, email ou dnia_id.
      tags:
        - Identidade
      parameters:
        - name: phone
          in: query
          schema:
            type: string
          description: Telefone no formato +55...
        - name: email
          in: query
          schema:
            type: string
          description: Email do contato
        - name: dnia_id
          in: query
          schema:
            type: string
            format: uuid
          description: DN.IA ID do ecossistema
      responses:
        '200':
          description: Identidade encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EcosystemIdentity'
                  - type: object
                    properties:
                      lead:
                        $ref: '#/components/schemas/LeadDetails'
        '400':
          description: Nenhum parâmetro de busca informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identidade não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: identityUpsert
      summary: Criar ou atualizar identidade
      description: |
        Cria uma nova identidade ou atualiza uma existente.
        
        **Merge automático:** Se o telefone informado pertence a uma identidade e o email
        pertence a outra, o sistema automaticamente mescla os dois registros, mantendo o
        DNIA_ID mais antigo. Nesse caso, a resposta inclui `merged: true` e `merged_from`.
      tags:
        - Identidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_app
                - local_id
              properties:
                phone:
                  type: string
                email:
                  type: string
                nome:
                  type: string
                source_app:
                  type: string
                  enum: [nexus, mentoria, dnmarketing, website]
                  description: Aplicação de origem do contato.
                local_id:
                  type: string
                  format: uuid
                stage:
                  type: string
                  enum: [lead, opportunity, client]
                source:
                  type: string
                  description: "Origem de negócio (ex: nome da landing). Quando o lead for criado, grava em `leads.source`; em lead existente só preenche se estiver vazio."
                utm_source:
                  type: string
                  description: UTM source. Grava em `leads.utm_source` (na criação) e em `ecosystem_identities.first_touch_source` (apenas na primeira aparição).
                utm_medium:
                  type: string
                utm_campaign:
                  type: string
                utm_term:
                  type: string
                utm_content:
                  type: string
                ab_vid:
                  type: string
                  description: "ID anônimo do visitante do Teste A/B. Costurado a `ab_identities` (histórico — nunca sobrescreve). Aceito no top-level ou dentro de `metadata`."
                ab_test:
                  type: string
                  description: Slug do teste A/B.
                ab_var:
                  type: string
                  description: Variante atribuída (A, B, ...).
                contact_fields:
                  type: object
                  description: |
                    Campos de qualificação para enriquecer o lead. Modo enriquecimento:
                    só grava se o campo estiver vazio no banco (não sobrescreve).
                    Para sobrescrever, use PATCH /contact-update.
                  properties:
                    cargo: { type: string }
                    empresa: { type: string }
                    faturamento: { type: string }
                    funcionarios: { type: string }
                    desafios: { type: string }
                metadata:
                  type: object
                  description: |
                    Objeto livre para metadados adicionais. Pode conter `contact_fields`
                    (mesma semântica do parâmetro top-level) para compatibilidade.

      responses:
        '200':
          description: Identidade criada, atualizada ou mesclada
          content:
            application/json:
              schema:
                type: object
                properties:
                  dnia_id:
                    type: string
                    format: uuid
                  is_new:
                    type: boolean
                  merged:
                    type: boolean
                  merged_from:
                    type: string
                    format: uuid
                    nullable: true
                  stage:
                    type: string
                  phone_normalized:
                    type: string
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lead-capture:
    post:
      operationId: leadCapture
      summary: Captura de lead (formulários públicos)
      description: |
        Endpoint usado pelos formulários públicos do site para criar/atualizar leads.
        Resolve a identidade automaticamente (gera/encontra `dnia_id`).
        Idempotente por `email`: se já existir lead com o mesmo email, atualiza.
      tags:
        - Leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                sessionId:
                  type: string
                  maxLength: 100
                fields:
                  type: object
                  description: |
                    Campos do lead. Apenas as chaves abaixo (whitelist) são aceitas;
                    qualquer outra é silenciosamente descartada.
                  properties:
                    nome: { type: string }
                    whatsapp: { type: string, description: "BR no formato (DD) 9XXXX-XXXX" }
                    cargo: { type: string }
                    empresa: { type: string }
                    faturamento: { type: string }
                    funcionarios: { type: string }
                    desafios: { type: string }
                    tipo: { type: string }
                    tipo_participante: { type: string }
                    source: { type: string, description: "Origem de negócio (ex: nome da landing)" }
                    presenca: { type: string }
                    origem_campanha: { type: string }
                    indicacao: { type: string }
                    interesse_formacao: { type: string }
                    interesse_ecossistema: { type: string }
                    interesse_mtia: { type: string }
                    data_interesse: { type: string }
                    status: { type: string }
                    utm_source: { type: string }
                    utm_medium: { type: string }
                    utm_campaign: { type: string }
                    utm_term: { type: string }
                    utm_content: { type: string }
      responses:
        '200':
          description: Lead criado ou atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  dnia_id: { type: string, format: uuid }
                  phone_normalized: { type: string, nullable: true }
                  etiqueta: { type: string, nullable: true }
        '400':
          description: "Dados inválidos (ex: email ausente)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /publico/contatos:
    get:
      operationId: contactsList
      summary: Listar contatos
      description: Lista leads com filtros, busca e paginação.
      tags:
        - Contatos
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Busca por nome, email ou telefone
        - name: etiqueta
          in: query
          schema:
            type: string
          description: Filtro por etiqueta
        - name: status
          in: query
          schema:
            type: string
          description: Status do lead
        - name: stage
          in: query
          schema:
            type: string
          description: Stage no ecossistema
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
          description: "Filtra leads criados após esta data (ISO 8601 ou YYYY-MM-DD interpretado no `tz`)."
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: "Filtra leads criados antes desta data."
        - name: updated_after
          in: query
          schema: { type: string, format: date-time }
          description: "Filtra leads atualizados após esta data."
        - name: updated_before
          in: query
          schema: { type: string, format: date-time }
          description: "Filtra leads atualizados antes desta data."
        - name: status_changed_after
          in: query
          schema: { type: string, format: date-time }
          description: "Filtra leads cujo último evento de mudança de status ocorreu após esta data."
        - name: tz
          in: query
          schema: { type: string, default: America/Sao_Paulo }
          description: "Timezone IANA usado para interpretar parâmetros YYYY-MM-DD."
        - name: cursor
          in: query
          schema: { type: string }
          description: "Cursor opaco (base64). Ative paginação por cursor para bases grandes (até limit=500). Sem cursor, usa page/limit clássicos."
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: "Ignorado quando `cursor` é informado."
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 500
          description: "Máx 100 sem cursor, 500 com cursor."
      responses:
        '200':
          description: Lista de contatos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactListItem'
                  pagination:
                    oneOf:
                      - $ref: '#/components/schemas/Pagination'
                      - type: object
                        properties:
                          limit: { type: integer }
                          next_cursor: { type: string, nullable: true }
                          has_more: { type: boolean }
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /publico/evento-de-contato:
    post:
      operationId: receiveContactEvent
      summary: Registrar evento na timeline
      description: |
        Registra um evento na timeline unificada do contato.
        O evento deal_won avança o stage automaticamente para "client".
      tags:
        - Eventos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_app
                - event_type
                - title
              properties:
                phone:
                  type: string
                email:
                  type: string
                dnia_id:
                  type: string
                  format: uuid
                source_app:
                  type: string
                  enum: [nexus, mentoria, dnmarketing, website]
                  description: Aplicação de origem do evento.
                event_type:
                  type: string
                  enum:
                    - opportunity_created
                    - meeting_scheduled
                    - deal_moved
                    - proposal_sent
                    - deal_won
                    - deal_lost
                    - onboarding_started
                    - onboarding_completed
                    - health_updated
                    - checkin_done
                title:
                  type: string
                description:
                  type: string
                contact_fields:
                  type: object
                  description: |
                    Enriquece o lead vinculado com campos de qualificação.
                    Modo enriquecimento: só grava se o campo estiver vazio.
                  properties:
                    cargo: { type: string }
                    empresa: { type: string }
                    faturamento: { type: string }
                    funcionarios: { type: string }
                    desafios: { type: string }
                ab_vid:
                  type: string
                  description: "ID anônimo do visitante do Teste A/B. Em `meeting_scheduled`/`scheduling_widget_booked` registra a conversão `agendamento` em `ab_events`. Aceito no top-level ou dentro de `metadata`."
                ab_test:
                  type: string
                  description: Slug do teste A/B.
                ab_var:
                  type: string
                  description: Variante atribuída (A, B, ...).
                metadata:
                  type: object
                  description: |
                    Objeto livre. Pode conter `contact_fields` (mesma semântica do top-level)
                    e/ou `ab_vid`/`ab_test`/`ab_var` do Teste A/B.
                occurred_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Evento registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  event_id:
                    type: string
                    format: uuid
                  dnia_id:
                    type: string
                    format: uuid
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Contato não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /publico/contato:
    get:
      operationId: contactDetails
      summary: Contexto completo de um contato
      description: |
        Retorna tudo sobre um contato em uma única chamada: identidade, dados do lead,
        score, tags, notas, timeline, conversões, campanhas e presença no ecossistema.
      tags:
        - Contatos
      parameters:
        - name: phone
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: dnia_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contexto completo do contato
          content:
            application/json:
              schema:
                type: object
                properties:
                  dnia_id:
                    type: string
                    format: uuid
                  stage:
                    type: string
                  lead:
                    type: object
                    nullable: true
                  scoring:
                    type: object
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: object
                  status_history:
                    type: array
                    description: |
                      Histórico de transições de status inferido a partir dos eventos.
                      Funciona retroativamente para toda a base.
                    items:
                      type: object
                      properties:
                        from: { type: string, example: "Lead" }
                        to: { type: string, example: "MQL - Reunião agendada" }
                        at: { type: string, format: date-time }
                        source_app: { type: string }
                        event_type: { type: string }
                  timeline:
                    type: array
                    items:
                      type: object
                  campaigns_received:
                    type: array
                    items:
                      type: object
        '404':
          description: Contato não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contact-update:
    patch:
      operationId: contactUpdate
      summary: Atualizar contato
      description: |
        Atualiza campos do lead, gerencia tags e adiciona notas. Registra evento
        contact_updated na timeline. Requer permissão write.
      tags:
        - Contatos
      parameters:
        - name: phone
          in: query
          schema:
            type: string
          description: Telefone do contato
        - name: email
          in: query
          schema:
            type: string
          description: Email do contato
        - name: dnia_id
          in: query
          schema:
            type: string
            format: uuid
          description: DN.IA ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                nome:
                  type: string
                cargo:
                  type: string
                whatsapp:
                  type: string
                empresa:
                  type: string
                faturamento:
                  type: string
                funcionarios:
                  type: string
                desafios:
                  type: string
                tags_add:
                  type: array
                  items:
                    type: string
                  description: Tags a adicionar (cria se não existir)
                tags_remove:
                  type: array
                  items:
                    type: string
                  description: Tags a remover
                note:
                  type: string
                  description: Nota a adicionar
      responses:
        '200':
          description: Contato atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dnia_id:
                    type: string
                    format: uuid
                  updated_fields:
                    type: array
                    items:
                      type: string
                  lead_score:
                    type: integer
                  etiqueta:
                    type: string
                    nullable: true
        '404':
          description: Contato não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contact-status-update:
    patch:
      operationId: contactStatusUpdate
      summary: Atualizar status do contato
      description: |
        Atualiza o status do lead identificado por `dnia_id`. Registra evento
        `contact_updated` na timeline e, quando o status for `Lead Qualificado`,
        dispara o handoff para o Nexus CRM (avança stage para `opportunity` e
        registra evento `lead_qualified`). Requer permissão write.
      tags:
        - Contatos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dnia_id, status]
              properties:
                dnia_id:
                  type: string
                  format: uuid
                  description: Identificador único do contato no ecossistema
                status:
                  type: string
                  enum:
                    - Lead
                    - Lead Qualificado
                    - MQL - Reunião agendada
                    - SQL - Em negociação
                    - Venda realizada
                    - Em contrato
                    - Iniciado
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dnia_id:
                    type: string
                    format: uuid
                  lead_id:
                    type: string
                    format: uuid
                  status_anterior:
                    type: string
                    nullable: true
                  status_atual:
                    type: string
        '400':
          description: Payload inválido (dnia_id/status ausente ou status fora da lista permitida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido ou sem permissão de escrita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: dnia_id não encontrado ou sem lead vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contact-tags-sync:
    put:
      operationId: contactTagsSync
      summary: Sincronizar tags do contato (substituição total)
      description: |
        Espelha o conjunto completo de tags de um contato. A origem (ex: Nexus)
        envia **todas** as tags do contato; o endpoint adiciona as novas, mantém
        as existentes e remove as que não vieram. Use `tags: []` para limpar
        todas as tags. Tags inexistentes são criadas automaticamente.
        Aceita também `POST` com a mesma semântica (substituição total).
        Registra evento `tags_synced` na timeline. Requer permissão write.
      tags:
        - Contatos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                dnia_id:
                  type: string
                  format: uuid
                  description: Identificador único do contato (preferencial)
                nexus_contact_id:
                  type: string
                  format: uuid
                  description: ID do contato no Nexus CRM (alternativo ao dnia_id)
                email:
                  type: string
                  format: email
                  description: Email do contato (fallback se nenhum ID for fornecido)
                tags:
                  type: array
                  description: Lista completa de tags do contato. Strings são normalizadas (trim, lowercase). Use [] para remover todas.
                  items:
                    type: string
                  example: ["cliente-vip", "evento-maio", "interessado-formacao"]
      responses:
        '200':
          description: Tags sincronizadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dnia_id:
                    type: string
                    format: uuid
                    nullable: true
                  lead_id:
                    type: string
                    format: uuid
                  tags_final:
                    type: array
                    items:
                      type: string
                  added:
                    type: array
                    items:
                      type: string
                  removed:
                    type: array
                    items:
                      type: string
                  kept:
                    type: array
                    items:
                      type: string
                  created_tags:
                    type: array
                    description: Tags criadas no banco por não existirem
                    items:
                      type: string
        '400':
          description: Payload inválido (sem identificador ou tags não é array)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido ou sem permissão de escrita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contato não encontrado ou sem lead vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: contactTagsSyncPost
      summary: Sincronizar tags do contato (alias POST)
      description: |
        Alias `POST` para `PUT /contact-tags-sync`. Mesma semântica de
        substituição total. Útil para clientes/CRMs que não suportam PUT.
      tags:
        - Contatos
      requestBody:
        $ref: '#/paths/~1contact-tags-sync/put/requestBody'
      responses:
        '200':
          $ref: '#/paths/~1contact-tags-sync/put/responses/200'
        '400':
          $ref: '#/paths/~1contact-tags-sync/put/responses/400'
        '401':
          $ref: '#/paths/~1contact-tags-sync/put/responses/401'
        '404':
          $ref: '#/paths/~1contact-tags-sync/put/responses/404'

  /publico/segmentos:
    get:
      operationId: segmentsList
      summary: Listar segmentos
      description: Lista segmentos com contagem de contatos e paginação.
      tags:
        - Segmentos
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [dynamic, static]
          description: Filtro por tipo
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de segmentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Segmento'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Chave de API ausente ou inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: segmentsCreate
      summary: Criar segmento
      description: |
        Cria um novo segmento. Para estáticos, envie contact_ids — o segmento e
        os membros são gravados na mesma transação.
        Exige chave de API com permissão de escrita.
      tags:
        - Segmentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [dynamic, static]
                  default: dynamic
                description:
                  type: string
                  nullable: true
                logic:
                  type: string
                  enum: [and, or]
                  default: and
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
                contact_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: IDs dos contatos (para segmentos estáticos)
      responses:
        '201':
          description: Segmento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  segment:
                    $ref: '#/components/schemas/Segmento'
        '400':
          description: Dados inválidos, ou algum contact_id não existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A chave não tem permissão de escrita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /publico/segmentos/{id}:
    get:
      operationId: segmentsGet
      summary: Detalhe do segmento
      description: |
        O segmento e uma amostra de até 20 contatos. Contato na lixeira
        (deleted_at preenchido) não aparece.
      tags:
        - Segmentos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Segmento com amostra de contatos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Segmento'
                  - type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            nome:
                              type: string
                              nullable: true
                            email:
                              type: string
                              nullable: true
                            whatsapp:
                              type: string
                              nullable: true
                            etiqueta:
                              type: string
                              nullable: true
                            status:
                              type: string
                              nullable: true
        '404':
