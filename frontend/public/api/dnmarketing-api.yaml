                subject:
                  type: string
                  nullable: true
                body:
                  type: string
                  nullable: true
                  description: O HTML do e-mail.
                segment_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                excluded_segment_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Campanha criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
