  /publico/segmentos/{id}/contatos:
    post:
      operationId: segmentsAddContacts
      summary: Adicionar contatos a um segmento estático
      description: |
        Só vale para segmento estático. Em segmento dinâmico devolve 409:
        quem entra nele é decidido pelas regras, e gravar a lista à mão não
        mudaria o que ele resolve. Exige permissão de escrita.
      tags:
        - Segmentos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids]
              properties:
                contact_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Contatos adicionados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  segment_id:
                    type: string
                    format: uuid
                  contacts_added:
                    type: integer
        '409':
          description: O segmento é dinâmico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /publico/campanhas:
    get:
      operationId: campaignsList
      summary: Listar campanhas
      description: |
        Lista campanhas com nomes de segmento e estatísticas ao vivo, agregadas
        de campaign_sends. Exige chave de API com permissão de leitura.
      tags:
        - Campanhas
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, sending, sent, paused, failed]
        - name: channel
          in: query
          schema:
            type: string
            enum: [email, whatsapp]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Lista de campanhas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campanha'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Chave de API ausente ou inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: campaignsCreate
      summary: Criar campanha
      description: |
        A campanha nasce SEMPRE em `draft` — o status não vem do corpo.
        Permitir `sending` deixaria disparar sem passar pelo enfileirador.
        Exige permissão de escrita.
      tags:
