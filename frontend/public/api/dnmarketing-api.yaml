  /campaigns-api:
    get:
      operationId: campaignsList
      summary: Listar campanhas
      description: Lista campanhas com stats e paginação.
      tags:
        - Campanhas
      parameters:
        - name: id
          in: query
          schema:
            type: string
            format: uuid
          description: ID da campanha para detalhes
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, sending]
        - name: channel
          in: query
          schema:
            type: string
            enum: [email, whatsapp]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de campanhas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        channel:
                          type: string
                        status:
                          type: string
                        segment_name:
                          type: string
                          nullable: true
                        stats:
                          type: object
                          description: |
                            Estatísticas da campanha computadas ao vivo a partir de `campaign_sends`.
                            Semântica de agregação (roll-ups): `sent` inclui delivered+opened+clicked;
                            `delivered` inclui opened+clicked; `opened` inclui clicked.
                            `bounced` e `complained` são novos status alimentados pelo webhook do Resend.
                            Se a agregação ao vivo falhar, retorna o objeto stats armazenado como fallback.
                          properties:
                            pending:
                              type: integer
                              description: Mensagens pendentes de envio
                            sent:
                              type: integer
                              description: Mensagens enviadas (inclui delivered, opened, clicked)
                            delivered:
                              type: integer
                              description: Mensagens entregues (inclui opened, clicked)
                            opened:
                              type: integer
                              description: Mensagens abertas (inclui clicked)
                            clicked:
                              type: integer
                              description: Mensagens clicadas
                            bounced:
                              type: integer
                              description: Mensagens que devolveram (rejeitadas)
                            complained:
                              type: integer
                              description: Mensagens marcadas como spam
                            failed:
                              type: integer
                              description: Falhas permanentes de envio
                            unsubscribed:
                              type: integer
                              description: Destinatários que se desinscreverem
                        sent_at:
                          type: string
                          format: date-time
                          nullable: true
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      operationId: campaignsCreate
      summary: Criar e disparar campanha
      description: |
        Cria uma campanha. Se send_now=true, dispara imediatamente.
        Use action=send&id=uuid para enviar uma campanha em draft.
      tags:
        - Campanhas
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [send]
        - name: id
          in: query
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - channel
              properties:
                name:
                  type: string
                channel:
                  type: string
                  enum: [email, whatsapp]
                segment_id:
                  type: string
                  format: uuid
                subject:
                  type: string
                body:
                  type: string
                send_now:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Campanha criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  campaign:
                    type: object

