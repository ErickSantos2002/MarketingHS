server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20M;

  # Quem é o cliente: só o proxy da frente (REAL_IP_FROM) é de confiança para
  # o X-Forwarded-For. O backend limita /publico por IP — sem isto, todo
  # visitante pareceria o mesmo IP (o do Traefik) e dividiria o mesmo teto.
  set_real_ip_from ${REAL_IP_FROM};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # /api/x → backend /x: o mesmo rewrite do proxy do Vite em desenvolvimento.
  location /api/ {
    proxy_pass http://${BACKEND_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O chat de IA e as análises demoram mais que o padrão de 60 s.
    proxy_read_timeout 180s;
  }

  # Landing pública: a página (/p/<slug>) e o bundle dela (/landing/) moram no
  # backend, sem rewrite.
  location /p/ {
    proxy_pass http://${BACKEND_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /landing/ {
    proxy_pass http://${BACKEND_UPSTREAM};
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
